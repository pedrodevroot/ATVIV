name: autobots-atviv

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autobots
      POSTGRES_USER: autobots
      POSTGRES_PASSWORD: autobots
    ports:
      - "5433:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autobots -d autobots"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - autobots-rede

  automanager:
    build: .
    image: autobots/automanager:2.0
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      JWT_SECRET: autobots-automanager-atviv-docker-segredo-jwt-hs512-com-64-caracteres-ou-mais
      JWT_EXPIRATION: 3600000
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autobots-rede

volumes:
  postgres-dados:

networks:
  autobots-rede:
